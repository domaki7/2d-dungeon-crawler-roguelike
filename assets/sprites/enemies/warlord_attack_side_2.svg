<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Horn (swept back) -->
  <rect x="12" y="2" width="2" height="2" fill="#E8DCC0"/>
  <rect x="10" y="4" width="2" height="2" fill="#E8DCC0"/>
  <!-- Helmet (hunched forward) -->
  <rect x="11" y="4" width="9" height="4" fill="#3A3A45"/>
  <rect x="11" y="4" width="9" height="1" fill="#565666"/>
  <!-- Face (profile) -->
  <rect x="15" y="8" width="6" height="5" fill="#5C8A3C"/>
  <rect x="15" y="8" width="6" height="1" fill="#3C5C26"/>
  <rect x="18" y="9" width="1" height="1" fill="#F2C641"/>
  <rect x="16" y="11" width="3" height="1" fill="#C22B1E"/>
  <rect x="20" y="12" width="1" height="2" fill="#E8DCC0"/>
  <!-- Body -->
  <rect x="9" y="13" width="11" height="6" fill="#5C8A3C"/>
  <rect x="9" y="13" width="1" height="6" fill="#3C5C26"/>
  <rect x="12" y="15" width="5" height="3" fill="#7BAA55"/>
  <!-- Shoulder pauldron -->
  <rect x="10" y="13" width="6" height="3" fill="#3A3A45"/>
  <rect x="10" y="13" width="6" height="1" fill="#565666"/>
  <!-- Arm extended forward -->
  <rect x="15" y="14" width="5" height="2" fill="#5C8A3C"/>
  <rect x="19" y="15" width="3" height="2" fill="#3C5C26"/>
  <!-- Club smashed into ground ahead -->
  <rect x="21" y="16" width="2" height="3" fill="#5F4728"/>
  <rect x="23" y="19" width="2" height="3" fill="#5F4728"/>
  <rect x="23" y="22" width="6" height="5" fill="#432D14"/>
  <rect x="29" y="23" width="1" height="1" fill="#9A9AA8"/>
  <rect x="22" y="24" width="1" height="1" fill="#9A9AA8"/>
  <rect x="25" y="21" width="1" height="1" fill="#9A9AA8"/>
  <!-- Impact sparks -->
  <rect x="21" y="27" width="1" height="1" fill="#F2C641"/>
  <rect x="30" y="26" width="1" height="1" fill="#F2C641"/>
  <rect x="29" y="20" width="1" height="1" fill="#F2C641"/>
  <!-- Belt -->
  <rect x="9" y="19" width="11" height="2" fill="#6B4A26"/>
  <rect x="13" y="19" width="2" height="2" fill="#DAA520"/>
  <!-- Legs (lunging) -->
  <rect x="9" y="22" width="3" height="5" fill="#3C5C26"/>
  <rect x="15" y="21" width="4" height="6" fill="#5C8A3C"/>
  <!-- Feet -->
  <rect x="7" y="27" width="5" height="3" fill="#432D14"/>
  <rect x="15" y="27" width="6" height="3" fill="#432D14"/>
</svg>
