<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Horns -->
  <rect x="5" y="1" width="2" height="2" fill="#E8DCC0"/>
  <rect x="6" y="3" width="2" height="2" fill="#E8DCC0"/>
  <rect x="25" y="1" width="2" height="2" fill="#E8DCC0"/>
  <rect x="24" y="3" width="2" height="2" fill="#E8DCC0"/>
  <!-- Helmet back -->
  <rect x="10" y="2" width="12" height="6" fill="#3A3A45"/>
  <rect x="10" y="2" width="12" height="1" fill="#565666"/>
  <rect x="11" y="8" width="10" height="2" fill="#26262E"/>
  <!-- Neck -->
  <rect x="13" y="10" width="6" height="1" fill="#3C5C26"/>
  <!-- Shoulders -->
  <rect x="6" y="11" width="5" height="3" fill="#3A3A45"/>
  <rect x="6" y="11" width="5" height="1" fill="#565666"/>
  <rect x="21" y="11" width="5" height="3" fill="#3A3A45"/>
  <rect x="21" y="11" width="5" height="1" fill="#565666"/>
  <!-- Back -->
  <rect x="10" y="11" width="12" height="8" fill="#5C8A3C"/>
  <rect x="21" y="11" width="1" height="8" fill="#3C5C26"/>
  <!-- Back plate -->
  <rect x="11" y="12" width="10" height="5" fill="#3A3A45"/>
  <rect x="11" y="12" width="10" height="1" fill="#565666"/>
  <rect x="15" y="12" width="2" height="5" fill="#26262E"/>
  <!-- Arms (swinging) -->
  <rect x="6" y="15" width="3" height="6" fill="#5C8A3C"/>
  <rect x="5" y="21" width="4" height="3" fill="#3C5C26"/>
  <rect x="23" y="13" width="3" height="6" fill="#5C8A3C"/>
  <rect x="23" y="19" width="4" height="3" fill="#3C5C26"/>
  <!-- Club (held in right hand = viewer left) -->
  <rect x="3" y="11" width="2" height="12" fill="#5F4728"/>
  <rect x="2" y="6" width="4" height="5" fill="#432D14"/>
  <rect x="1" y="7" width="1" height="1" fill="#9A9AA8"/>
  <rect x="6" y="7" width="1" height="1" fill="#9A9AA8"/>
  <rect x="3" y="5" width="1" height="1" fill="#9A9AA8"/>
  <!-- Belt -->
  <rect x="10" y="19" width="12" height="2" fill="#6B4A26"/>
  <!-- Legs (right forward) -->
  <rect x="11" y="21" width="4" height="7" fill="#5C8A3C"/>
  <rect x="17" y="21" width="4" height="5" fill="#5C8A3C"/>
  <rect x="15" y="21" width="2" height="3" fill="#3C5C26"/>
  <!-- Feet -->
  <rect x="10" y="28" width="6" height="3" fill="#432D14"/>
  <rect x="16" y="26" width="6" height="3" fill="#432D14"/>
</svg>
