<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Horns -->
  <rect x="5" y="1" width="2" height="2" fill="#E8DCC0"/>
  <rect x="6" y="3" width="2" height="2" fill="#E8DCC0"/>
  <rect x="25" y="1" width="2" height="2" fill="#E8DCC0"/>
  <rect x="24" y="3" width="2" height="2" fill="#E8DCC0"/>
  <!-- Helmet -->
  <rect x="10" y="2" width="12" height="4" fill="#3A3A45"/>
  <rect x="10" y="2" width="12" height="1" fill="#565666"/>
  <!-- Face -->
  <rect x="11" y="6" width="10" height="5" fill="#5C8A3C"/>
  <rect x="11" y="6" width="10" height="1" fill="#3C5C26"/>
  <rect x="13" y="7" width="2" height="1" fill="#F2C641"/>
  <rect x="17" y="7" width="2" height="1" fill="#F2C641"/>
  <rect x="11" y="9" width="2" height="1" fill="#C22B1E"/>
  <rect x="19" y="9" width="2" height="1" fill="#C22B1E"/>
  <rect x="12" y="10" width="1" height="1" fill="#E8DCC0"/>
  <rect x="19" y="10" width="1" height="1" fill="#E8DCC0"/>
  <rect x="13" y="10" width="6" height="1" fill="#3C5C26"/>
  <!-- Shoulders -->
  <rect x="6" y="11" width="5" height="3" fill="#3A3A45"/>
  <rect x="6" y="11" width="5" height="1" fill="#565666"/>
  <rect x="21" y="11" width="5" height="3" fill="#3A3A45"/>
  <rect x="21" y="11" width="5" height="1" fill="#565666"/>
  <!-- Chest -->
  <rect x="10" y="11" width="12" height="8" fill="#5C8A3C"/>
  <rect x="10" y="11" width="1" height="8" fill="#3C5C26"/>
  <rect x="10" y="12" width="12" height="1" fill="#26262E"/>
  <rect x="13" y="14" width="6" height="4" fill="#7BAA55"/>
  <rect x="14" y="13" width="4" height="1" fill="#C22B1E"/>
  <!-- Arms (swinging) -->
  <rect x="6" y="15" width="3" height="6" fill="#5C8A3C"/>
  <rect x="5" y="21" width="4" height="3" fill="#3C5C26"/>
  <rect x="23" y="13" width="3" height="6" fill="#5C8A3C"/>
  <rect x="23" y="19" width="4" height="3" fill="#3C5C26"/>
  <!-- Club -->
  <rect x="27" y="9" width="2" height="12" fill="#5F4728"/>
  <rect x="26" y="4" width="4" height="5" fill="#432D14"/>
  <rect x="25" y="5" width="1" height="1" fill="#9A9AA8"/>
  <rect x="30" y="5" width="1" height="1" fill="#9A9AA8"/>
  <rect x="27" y="3" width="1" height="1" fill="#9A9AA8"/>
