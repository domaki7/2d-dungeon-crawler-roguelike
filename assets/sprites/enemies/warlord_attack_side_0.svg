<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Club raised behind over shoulder -->
  <rect x="4" y="1" width="5" height="5" fill="#432D14"/>
  <rect x="3" y="2" width="1" height="1" fill="#9A9AA8"/>
  <rect x="9" y="2" width="1" height="1" fill="#9A9AA8"/>
  <rect x="6" y="0" width="1" height="1" fill="#9A9AA8"/>
  <rect x="8" y="6" width="2" height="2" fill="#5F4728"/>
  <rect x="10" y="8" width="2" height="2" fill="#5F4728"/>
  <rect x="12" y="10" width="2" height="2" fill="#5F4728"/>
  <!-- Horn (swept back) -->
  <rect x="13" y="1" width="2" height="2" fill="#E8DCC0"/>
  <rect x="11" y="3" width="2" height="2" fill="#E8DCC0"/>
  <!-- Helmet -->
  <rect x="12" y="3" width="9" height="4" fill="#3A3A45"/>
  <rect x="12" y="3" width="9" height="1" fill="#565666"/>
  <!-- Face (profile) -->
  <rect x="16" y="7" width="6" height="5" fill="#5C8A3C"/>
  <rect x="16" y="7" width="6" height="1" fill="#3C5C26"/>
  <rect x="19" y="8" width="1" height="1" fill="#F2C641"/>
  <rect x="17" y="10" width="3" height="1" fill="#C22B1E"/>
  <rect x="21" y="11" width="1" height="2" fill="#E8DCC0"/>
  <!-- Arm reaching up-back to club -->
  <rect x="13" y="12" width="3" height="3" fill="#3C5C26"/>
  <!-- Body (leaning back) -->
  <rect x="10" y="12" width="11" height="7" fill="#5C8A3C"/>
  <rect x="10" y="12" width="1" height="7" fill="#3C5C26"/>
  <rect x="13" y="15" width="5" height="3" fill="#7BAA55"/>
  <!-- Shoulder pauldron -->
  <rect x="11" y="12" width="6" height="3" fill="#3A3A45"/>
  <rect x="11" y="12" width="6" height="1" fill="#565666"/>
  <!-- Belt -->
  <rect x="10" y="19" width="11" height="2" fill="#6B4A26"/>
  <rect x="14" y="19" width="2" height="2" fill="#DAA520"/>
  <!-- Legs braced -->
  <rect x="10" y="21" width="3" height="6" fill="#3C5C26"/>
  <rect x="15" y="21" width="4" height="6" fill="#5C8A3C"/>
  <!-- Feet -->
  <rect x="9" y="27" width="5" height="3" fill="#432D14"/>
  <rect x="15" y="27" width="6" height="3" fill="#432D14"/>
</svg>
