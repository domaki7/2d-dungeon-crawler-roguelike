<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Horn (swept back) -->
  <rect x="12" y="0" width="2" height="2" fill="#E8DCC0"/>
  <rect x="10" y="2" width="2" height="2" fill="#E8DCC0"/>
  <!-- Helmet -->
  <rect x="11" y="2" width="9" height="4" fill="#3A3A45"/>
  <rect x="11" y="2" width="9" height="1" fill="#565666"/>
  <!-- Face (profile) -->
  <rect x="15" y="6" width="6" height="5" fill="#5C8A3C"/>
  <rect x="15" y="6" width="6" height="1" fill="#3C5C26"/>
  <rect x="18" y="7" width="1" height="1" fill="#F2C641"/>
  <rect x="16" y="9" width="3" height="1" fill="#C22B1E"/>
  <rect x="20" y="10" width="1" height="2" fill="#E8DCC0"/>
  <rect x="15" y="10" width="5" height="1" fill="#3C5C26"/>
  <!-- Body -->
  <rect x="9" y="11" width="11" height="8" fill="#5C8A3C"/>
  <rect x="9" y="11" width="1" height="8" fill="#3C5C26"/>
  <rect x="12" y="14" width="5" height="4" fill="#7BAA55"/>
  <!-- Shoulder pauldron -->
  <rect x="10" y="11" width="6" height="3" fill="#3A3A45"/>
  <rect x="10" y="11" width="6" height="1" fill="#565666"/>
  <!-- Arm gripping club -->
  <rect x="14" y="14" width="3" height="4" fill="#5C8A3C"/>
  <rect x="17" y="15" width="4" height="2" fill="#3C5C26"/>
  <rect x="20" y="14" width="3" height="2" fill="#3C5C26"/>
  <!-- Club carried in front -->
  <rect x="21" y="14" width="2" height="8" fill="#5F4728"/>
  <rect x="20" y="21" width="5" height="5" fill="#432D14"/>
  <rect x="25" y="22" width="1" height="1" fill="#9A9AA8"/>
  <rect x="19" y="23" width="1" height="1" fill="#9A9AA8"/>
  <rect x="22" y="20" width="1" height="1" fill="#9A9AA8"/>
  <!-- Belt -->
  <rect x="9" y="19" width="11" height="2" fill="#6B4A26"/>
  <rect x="13" y="19" width="2" height="2" fill="#DAA520"/>
  <!-- Legs (far forward, near back) -->
  <rect x="11" y="21" width="3" height="5" fill="#3C5C26"/>
  <rect x="13" y="22" width="4" height="5" fill="#5C8A3C"/>
  <!-- Feet -->
  <rect x="12" y="26" width="5" height="3" fill="#432D14"/>
  <rect x="11" y="27" width="1" height="1" fill="#432D14"/>
  <rect x="14" y="27" width="6" height="3" fill="#432D14"/>
</svg>
