<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Club smashed into ground ahead (top of view) -->
  <rect x="13" y="1" width="7" height="5" fill="#432D14"/>
  <rect x="12" y="2" width="1" height="1" fill="#9A9AA8"/>
  <rect x="20" y="2" width="1" height="1" fill="#9A9AA8"/>
  <rect x="16" y="0" width="1" height="1" fill="#9A9AA8"/>
  <rect x="15" y="6" width="2" height="5" fill="#5F4728"/>
  <!-- Impact sparks -->
  <rect x="10" y="1" width="1" height="1" fill="#F2C641"/>
  <rect x="22" y="1" width="1" height="1" fill="#F2C641"/>
  <rect x="11" y="5" width="1" height="1" fill="#F2C641"/>
  <rect x="21" y="4" width="1" height="1" fill="#F2C641"/>
  <!-- Arms reaching up to club -->
  <rect x="11" y="8" width="3" height="5" fill="#5C8A3C"/>
  <rect x="12" y="7" width="3" height="2" fill="#3C5C26"/>
  <rect x="18" y="8" width="3" height="5" fill="#5C8A3C"/>
  <rect x="17" y="7" width="3" height="2" fill="#3C5C26"/>
  <!-- Horns -->
  <rect x="6" y="9" width="2" height="2" fill="#E8DCC0"/>
  <rect x="7" y="11" width="2" height="2" fill="#E8DCC0"/>
  <rect x="24" y="9" width="2" height="2" fill="#E8DCC0"/>
  <rect x="23" y="11" width="2" height="2" fill="#E8DCC0"/>
  <!-- Helmet back (hunched forward) -->
  <rect x="10" y="10" width="12" height="5" fill="#3A3A45"/>
  <rect x="10" y="10" width="12" height="1" fill="#565666"/>
  <rect x="11" y="15" width="10" height="1" fill="#26262E"/>
  <!-- Shoulders -->
  <rect x="6" y="15" width="5" height="3" fill="#3A3A45"/>
  <rect x="6" y="15" width="5" height="1" fill="#565666"/>
  <rect x="21" y="15" width="5" height="3" fill="#3A3A45"/>
  <rect x="21" y="15" width="5" height="1" fill="#565666"/>
  <!-- Back -->
  <rect x="10" y="15" width="12" height="5" fill="#5C8A3C"/>
  <rect x="21" y="15" width="1" height="5" fill="#3C5C26"/>
  <!-- Back plate -->
  <rect x="11" y="16" width="10" height="3" fill="#3A3A45"/>
  <rect x="15" y="16" width="2" height="3" fill="#26262E"/>
  <!-- Belt -->
  <rect x="10" y="20" width="12" height="2" fill="#6B4A26"/>
  <!-- Legs braced -->
  <rect x="10" y="22" width="4" height="5" fill="#5C8A3C"/>
  <rect x="18" y="22" width="4" height="5" fill="#5C8A3C"/>
  <!-- Feet -->
  <rect x="9" y="27" width="6" height="3" fill="#432D14"/>
  <rect x="17" y="27" width="6" height="3" fill="#432D14"/>
</svg>
