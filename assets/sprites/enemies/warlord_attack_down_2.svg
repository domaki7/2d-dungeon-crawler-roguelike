<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Horns -->
  <rect x="5" y="3" width="2" height="2" fill="#E8DCC0"/>
  <rect x="6" y="5" width="2" height="2" fill="#E8DCC0"/>
  <rect x="25" y="3" width="2" height="2" fill="#E8DCC0"/>
  <rect x="24" y="5" width="2" height="2" fill="#E8DCC0"/>
  <!-- Helmet (leaning into smash) -->
  <rect x="10" y="4" width="12" height="4" fill="#3A3A45"/>
  <rect x="10" y="4" width="12" height="1" fill="#565666"/>
  <!-- Face -->
  <rect x="11" y="8" width="10" height="5" fill="#5C8A3C"/>
  <rect x="11" y="8" width="10" height="1" fill="#3C5C26"/>
  <rect x="13" y="9" width="2" height="1" fill="#F2C641"/>
  <rect x="17" y="9" width="2" height="1" fill="#F2C641"/>
  <rect x="11" y="11" width="2" height="1" fill="#C22B1E"/>
  <rect x="19" y="11" width="2" height="1" fill="#C22B1E"/>
  <rect x="12" y="12" width="1" height="1" fill="#E8DCC0"/>
  <rect x="19" y="12" width="1" height="1" fill="#E8DCC0"/>
  <!-- Shoulders -->
  <rect x="6" y="13" width="5" height="3" fill="#3A3A45"/>
  <rect x="6" y="13" width="5" height="1" fill="#565666"/>
  <rect x="21" y="13" width="5" height="3" fill="#3A3A45"/>
  <rect x="21" y="13" width="5" height="1" fill="#565666"/>
  <!-- Chest -->
  <rect x="10" y="13" width="12" height="6" fill="#5C8A3C"/>
  <rect x="10" y="13" width="1" height="6" fill="#3C5C26"/>
  <rect x="10" y="14" width="12" height="1" fill="#26262E"/>
  <rect x="13" y="15" width="6" height="3" fill="#7BAA55"/>
  <!-- Arms slammed down in front -->
  <rect x="8" y="16" width="3" height="6" fill="#5C8A3C"/>
  <rect x="21" y="16" width="3" height="6" fill="#5C8A3C"/>
  <rect x="19" y="21" width="3" height="2" fill="#3C5C26"/>
  <!-- Club smashed into ground in front -->
  <rect x="17" y="20" width="2" height="5" fill="#5F4728"/>
  <rect x="13" y="25" width="7" height="5" fill="#432D14"/>
  <rect x="12" y="26" width="1" height="1" fill="#9A9AA8"/>
  <rect x="20" y="26" width="1" height="1" fill="#9A9AA8"/>
  <rect x="16" y="24" width="1" height="1" fill="#9A9AA8"/>
  <!-- Impact sparks -->
  <rect x="10" y="28" width="1" height="1" fill="#F2C641"/>
  <rect x="22" y="28" width="1" height="1" fill="#F2C641"/>
  <rect x="11" y="25" width="1" height="1" fill="#F2C641"/>
  <rect x="21" y="24" width="1" height="1" fill="#F2C641"/>
  <!-- Belt -->
  <rect x="10" y="19" width="12" height="2" fill="#6B4A26"/>
  <rect x="15" y="19" width="2" height="2" fill="#DAA520"/>
  <!-- Legs braced -->
  <rect x="9" y="21" width="4" height="6" fill="#5C8A3C"/>
  <rect x="21" y="21" width="4" height="6" fill="#5C8A3C"/>
  <!-- Feet -->
  <rect x="8" y="27" width="6" height="3" fill="#432D14"/>
  <rect x="21" y="27" width="6" height="3" fill="#432D14"/>
</svg>
