<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- cork -->
  <rect x="6" y="2" width="4" height="2" fill="#8B5A2B"/>
  <rect x="6" y="2" width="1" height="2" fill="#A9713A"/>
  <!-- neck -->
  <rect x="6" y="4" width="4" height="2" fill="#9FD8E8"/>
  <!-- flask body -->
  <rect x="4" y="6" width="8" height="8" fill="#9FD8E8"/>
  <rect x="5" y="5" width="6" height="1" fill="#9FD8E8"/>
  <!-- liquid -->
  <rect x="5" y="8" width="6" height="5" fill="#2E8B57"/>
  <rect x="5" y="8" width="6" height="1" fill="#4BD07A"/>
  <!-- bubbles -->
  <rect x="7" y="10" width="1" height="1" fill="#B8FFD0"/>
  <rect x="9" y="11" width="1" height="1" fill="#B8FFD0"/>
  <!-- glass highlight -->
  <rect x="5" y="6" width="1" height="2" fill="#E8FAFF"/>
  <rect x="5" y="9" width="1" height="3" fill="#5FE08F"/>
  <!-- glass shade -->
  <rect x="11" y="7" width="1" height="6" fill="#6FAEC0"/>
  <rect x="5" y="13" width="6" height="1" fill="#1B5E38"/>
</svg>
